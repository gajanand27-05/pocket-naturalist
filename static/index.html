<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2b">
<title>Pocket Naturalist</title>
<style>
  :root { --bg:#f4f1e8; --ink:#1d2b22; --muted:#5d6b61; --accent:#2f6b45; --card:#fffdf7; --warn:#a0522d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121a15; --ink:#e7ede8; --muted:#9aa89e; --accent:#7cc495; --card:#1b251f; --warn:#e0a07a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 120px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; border:0; border-radius:14px; padding:16px; width:100%; cursor:pointer; }
  .primary { background:var(--accent); color:var(--bg); font-weight:600; font-size:1.15rem; }
  .ghost { background:transparent; color:var(--muted); text-decoration:underline; }
  .quest { background:var(--card); border-left:5px solid var(--accent); border-radius:12px; padding:14px; margin:0 0 16px; }
  .quest small { color:var(--muted); display:block; text-transform:uppercase; letter-spacing:.06em; font-size:.75rem; }
  .card { background:var(--card); border-radius:16px; overflow:hidden; margin:16px 0; box-shadow:0 2px 10px #0002; }
  .card img { width:100%; max-height:300px; object-fit:cover; display:block; }
  .card .body { padding:14px 16px; }
  .card h2 { margin:0; font-size:1.3rem; }
  .card i { color:var(--muted); }
  .meter { height:8px; background:#8883; border-radius:4px; margin:10px 0 4px; }
  .meter span { display:block; height:100%; border-radius:4px; background:var(--accent); }
  .unsure { color:var(--warn); font-weight:600; }
  .seen, .alt { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
  .alt:empty, .tell[hidden] { display:none; }
  .secondary { background:var(--card); color:var(--accent); font-weight:600; border:2px solid var(--accent); }
  .tell { background:#a0522d1a; border-radius:10px; padding:8px 10px; margin:10px 0 0; }
  .hear { width:auto; margin-top:10px; padding:8px 12px; font-size:.9rem; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .fix { margin-top:10px; color:var(--muted); font-size:.9rem; }
  .fix form { display:flex; gap:8px; margin-top:8px; }
  .fix input { flex:1; font:inherit; padding:10px; border-radius:10px; border:1px solid #8886; background:var(--bg); color:var(--ink); }
  .fix button { width:auto; padding:10px 14px; background:var(--accent); color:var(--bg); }
  button:disabled { opacity:.5; }
  .status { text-align:center; color:var(--muted); padding:20px 0; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(8px + env(safe-area-inset-bottom)); background:var(--bg); box-shadow:0 -4px 12px #0002; }
  .bar > div { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:14px 8px; font-size:1rem; }
  .ghost { padding:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🌿 Pocket Naturalist</h1>
  <p class="sub">Snap it live, or add garden photos from your gallery later. Runs on your own laptop.</p>

  <div id="questBox" class="quest" hidden><small>Your quest</small><span id="quest"></span></div>
  <div id="status" class="status" hidden></div>
  <div id="finds"></div>
</main>

<div class="bar" id="bar"><div>
  <button id="start" class="primary">Start a walk</button>
  <div class="row">
    <button id="snap" class="primary" hidden>📷 Snap</button>
    <button id="pick" class="secondary">🖼️ Gallery</button>
  </div>
  <button id="end" class="ghost" hidden>End walk &amp; write my journal</button>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="gallery" type="file" accept="image/*" multiple hidden>
</div></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let walk = store.get('walk'), quest = store.get('quest');

async function api(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const out = await r.json();
  if (out.error) throw new Error(out.error);
  return out;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.95;
  speechSynthesis.speak(u);
}

function render() {
  $('start').hidden = !!walk;
  $('snap').hidden = $('end').hidden = !walk;
  $('questBox').hidden = !quest;
  $('quest').textContent = quest || '';
}

function status(msg) { $('status').hidden = !msg; $('status').textContent = msg || ''; }

// Phone photos are huge; shrink to 1024px before sending to the laptop.
// Big camera photos decoded at full size exhaust the phone browser's memory after a few,
// so decode straight to ~1024px, free everything right away, and retry once after a pause.
async function shrink(file) {
  try { return await shrinkOnce(file); }
  catch { await new Promise(r => setTimeout(r, 1500)); return shrinkOnce(file); }
}

async function shrinkOnce(file) {
  let src;
  try { src = await createImageBitmap(file, { resizeWidth: 1024, resizeQuality: 'high' }); }
  catch { src = await loadImage(file); }  // browsers without resize support
  const s = Math.min(1, 1024 / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  src.close?.();
  const url = c.toDataURL('image/jpeg', 0.85);
  c.width = c.height = 0;  // release the canvas memory now, not at the next GC
  return url;
}

function loadImage(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url);
      fail(new Error("the phone couldn't open this image (video or unsupported format?)")); };
    img.src = url;
  });
}

function setTitle(el, f) {
  const h = el.querySelector('h2');
  h.textContent = f.corrected_from ? `✏️ ${f.common_name}` : f.mystery ? `🔍 Mystery: maybe ${f.common_name}?` : f.common_name;
  h.classList.toggle('unsure', !!f.mystery);
  el.querySelector('.tell').hidden = !f.mystery || !f.how_to_tell;
  el.querySelector('.alt').textContent = f.corrected_from
    ? `You identified it · Gemma guessed: ${f.corrected_from}`
    : (f.also_could_be?.length ? 'Could also be: ' + f.also_could_be.join(', ') : '')
      + (f.first_guess ? ` · 🔁 took a second look (first guess: ${f.first_guess})` : '');
}

function sayFind(f) {
  if (f.corrected_from) return `This is ${f.common_name}. You identified it.`;
  if (f.mystery) return `A mystery. Maybe ${f.common_name}. ${f.how_to_tell || ''}`;
  return `That's ${f.common_name}. ${f.look_closer}`;
}

function addCard(f, src) {
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `<img alt=""><div class="body"><h2></h2>
    <div class="meter"><span></span></div><small></small>
    <p class="tell"></p><p class="seen"></p><p class="alt"></p><p class="fact"></p>
    <button class="hear" type="button">🔊 Hear it</button>
    <details class="fix"><summary>✏️ I know what this is</summary>
      <form><input placeholder="e.g. Butterfly pea" maxlength="80" required><button>Save</button></form>
    </details></div>`;
  el.querySelector('img').src = src;
  el.querySelector('.meter span').style.width = `${Math.round(f.confidence * 100)}%`;
  el.querySelector('small').textContent = `${Math.round(f.confidence * 100)}% sure · ${f.kind} · ${f.time}`;
  el.querySelector('.tell').textContent = '🔍 How to tell: ' + (f.how_to_tell || '');
  el.querySelector('.seen').textContent = '👀 ' + (f.visible_features || []).join(' · ');
  el.querySelector('.fact').textContent = '🔎 ' + f.look_closer;
  setTitle(el, f);
  el.querySelector('.hear').onclick = () => speak(sayFind(f));
  el.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    try {
      const fixed = await api('/api/correct', { walk, photo: f.photo, name: ev.target[0].value });
      Object.assign(f, fixed); setTitle(el, f); el.querySelector('.fix').hidden = true;
    } catch (e) { status('Could not save: ' + e.message); }
  };
  $('finds').prepend(el);
}

// When was the photo taken? Read the EXIF date inside the JPEG; fall back to the file date.
async function photoTime(file) {
  try {
    const head = new TextDecoder('latin1').decode(await file.slice(0, 131072).arrayBuffer());
    const m = head.match(/\d{4}:\d\d:\d\d (\d\d):(\d\d):\d\d/);
    if (m) return `${m[1]}:${m[2]}`;
  } catch {}
  return new Date(file.lastModified).toTimeString().slice(0, 5);
}

// Gemma thought it wasn't nature; let the walker overrule it.
function addSkippedCard(src, taken) {
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `<img alt=""><div class="body"><h2 class="unsure">Skipped: Gemma didn't see a plant or animal</h2>
    <button class="hear" type="button">🌿 It is nature, identify it anyway</button></div>`;
  el.querySelector('img').src = src;
  el.querySelector('button').onclick = async () => {
    el.remove();
    try { await identifyOne(src, taken, '', true); status(''); }
    catch (e) { status('Hmm, that failed: ' + e.message); }
  };
  $('finds').prepend(el);
}

async function ensureWalk() {
  if (walk) return;
  ({ walk } = await api('/api/walk/start', {}));
  quest = 'Find something alive that catches your eye.';
  store.set('walk', walk); store.set('quest', quest);
  $('finds').innerHTML = '';
  render();
}

// Identify one photo; `taken` is the HH:MM the photo was taken (gallery) or null (live).
// `image` is an already-shrunk data URL (see shrink).
async function identifyOne(image, taken, label, force = false) {
  const t0 = Date.now();
  const tick = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000);
    status(`${label}${s < 35 ? `🔍 Gemma is looking… ${s}s` : `🔁 Not sure yet, taking a closer look… ${s}s`}`); }, 500);
  try {
    let f;
    try { f = await api('/api/identify', { walk, image, quest, taken, force }); }
    catch (e) {
      if (e.message !== 'walk ended') throw e;
      walk = null; await ensureWalk();  // that walk already has a journal: start a new one
      f = await api('/api/identify', { walk, image, quest, taken, force });
    }
    if (f.skipped) { addSkippedCard(image, taken); return null; }
    addCard(f, image);
    quest = f.next_quest; store.set('quest', quest); render();
    return f;
  } finally { clearInterval(tick); }
}

$('start').onclick = async () => {
  try { await ensureWalk(); speak(quest); }
  catch (e) { status('Could not start: ' + e.message); }
};

$('snap').onclick = () => $('cam').click();
$('pick').onclick = () => $('gallery').click();

$('cam').onchange = async () => {
  const file = $('cam').files[0]; $('cam').value = '';
  if (!file) return;
  $('snap').disabled = $('pick').disabled = true;
  try {
    const f = await identifyOne(await shrink(file), null, '');
    if (!f) return speak("That doesn't look like a nature find. Try a plant, bird or bug.");
    speak(`${sayFind(f)} Your next quest: ${f.next_quest}`);
    status('');
  } catch (e) { status('Hmm, that failed: ' + e.message); }
  finally { $('snap').disabled = $('pick').disabled = false; }
};

// Took photos in the garden without the laptop? Add them afterwards, oldest first.
$('gallery').onchange = async () => {
  const files = [...$('gallery').files].sort((a, b) => a.lastModified - b.lastModified);
  $('gallery').value = '';
  if (!files.length) return;
  $('snap').disabled = $('pick').disabled = $('end').disabled = true;
  try {
    await ensureWalk();
    // Read and shrink every photo up front: Android can revoke access to picked files
    // while a long batch is still being identified.
    const ready = [], found = [], failed = [];
    for (const [i, file] of files.entries()) {
      status(`📥 Preparing photo ${i + 1} of ${files.length}…`);
      try { ready.push({ name: file.name, taken: await photoTime(file), image: await shrink(file) }); }
      catch (e) { failed.push(`${file.name}: ${e.message}`); }
    }
    for (const [i, p] of ready.entries()) {
      try {  // one bad photo shouldn't stop the rest of the batch
        const f = await identifyOne(p.image, p.taken, `Photo ${i + 1} of ${ready.length} · `);
        if (f) found.push(f);
      } catch (e) { failed.push(`${p.name}: ${e.message}`); }
    }
    const added = found.length, mysteries = found.filter(f => f.mystery).length;
    if (added) speak(`Added ${added} find${added === 1 ? '' : 's'}: ${found.map(f => f.common_name).join(', ')}.`
      + (mysteries ? ` ${mysteries} mystery find${mysteries === 1 ? '' : 's'} to check. Tap it to hear how to tell.` : ''));
    const skipped = files.length - added - failed.length;
    status(`✅ Added ${added} photo${added === 1 ? '' : 's'}`
      + (skipped ? ` · skipped ${skipped} that weren't nature finds` : '')
      + (failed.length ? ` · ⚠️ ${failed.length} failed: ${failed.join('; ')}` : '') + '.');
  } catch (e) { status('Hmm, that failed: ' + e.message); }
  finally { $('snap').disabled = $('pick').disabled = $('end').disabled = false; }
};

$('end').onclick = async () => {
  $('end').disabled = true;
  status('✍️ Writing your walk journal…');
  try {
    const { journal } = await api('/api/walk/end', { walk });
    walk = quest = null; store.set('walk', null); store.set('quest', null);
    location.href = journal;
  } catch (e) { status(e.message); $('end').disabled = false; }
};

// Keep the last card visible above the fixed button bar, whatever its height.
const fitBar = () => { document.querySelector('main').style.paddingBottom = $('bar').offsetHeight + 24 + 'px'; };
new ResizeObserver(fitBar).observe($('bar'));

// Coming back from the journal with the Back button restores a stale page; reload it.
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

// Reopened mid-walk (refresh, closed tab)? Bring back the cards saved on the laptop.
async function restoreWalk() {
  if (!walk) return;
  try {
    const r = await fetch(`/walks/${walk}/finds.json`, { cache: 'no-store' });
    if (r.ok) for (const f of await r.json()) addCard(f, `/walks/${walk}/${f.photo}`);
  } catch {}
}

render();
restoreWalk();
</script>
</body>
</html>
